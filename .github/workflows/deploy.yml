name: Deploy Stores

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub Release tag to create, for example v1.0.1001"
        required: false
        type: string
      publish_stores:
        description: "Attempt Google Play/TestFlight uploads when secrets are present"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: store-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Release gate checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run release gate checks
        run: tools/release_gate.sh --skip-ios

      - name: Upload release gate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-gate-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            build/release-gate/*.txt
            build/release-gate/*.env
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/*.txt

  github-release:
    name: GitHub release package
    needs:
      - tests
      - ios-package
    if: always() && needs.tests.result == 'success' && (github.event_name == 'push' || inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release-meta
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG_INPUT:-}" ]; then
            tag="$RELEASE_TAG_INPUT"
          else
            version_code=$((GITHUB_RUN_NUMBER + 1000))
            tag="v1.0.$version_code"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
            release-artifacts/**/*.txt
            release-artifacts/**/*.zip

  ios-package:
    name: iOS release simulator package
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build iOS release simulator app
        run: IOS_RELEASE_TIMEOUT_SECONDS=1080 tools/ios_release_package.sh

      - name: Upload iOS release simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-simulator-${{ github.run_number }}
          if-no-files-found: error
          path: build/release-artifacts/*.zip

  android:
    name: Android internal testing
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_stores
    env:
      ANDROID_PACKAGE_NAME: com.jjswigut.oopsallprs.android
      ANDROID_PLAY_TRACK: internal
      ANDROID_RELEASE_STATUS: completed
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check Android deploy secrets
        id: android-secrets
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf '::notice::Skipping Android deploy. Missing secrets: %s\n' "${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.android-secrets.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up JDK
        if: steps.android-secrets.outputs.ready == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.android-secrets.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby
        if: steps.android-secrets.outputs.ready == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare Android signing
        if: steps.android-secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/android-upload-keystore.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Set Android version
        if: steps.android-secrets.outputs.ready == 'true'
        run: |
          version_code=$((GITHUB_RUN_NUMBER + 1000))
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.0.$version_code" >> "$GITHUB_ENV"

      - name: Upload Android bundle to Play internal testing
        if: steps.android-secrets.outputs.ready == 'true'
        run: tools/fastlane.sh android internal

  ios:
    name: iOS TestFlight
    needs: tests
    runs-on: macos-latest
    if: github.event_name == 'push' || inputs.publish_stores
    env:
      IOS_BUNDLE_ID: com.jjswigut.oopsallprs.ios
      IOS_MARKETING_VERSION: "1.0"
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - name: Check iOS deploy secrets
        id: ios-secrets
        run: |
          set -euo pipefail
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64 IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf '::notice::Skipping iOS deploy. Missing secrets: %s\n' "${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.ios-secrets.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up JDK
        if: steps.ios-secrets.outputs.ready == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.ios-secrets.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby
        if: steps.ios-secrets.outputs.ready == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Apple signing assets
        if: steps.ios-secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/ios-distribution.p12"
          profile_path="$RUNNER_TEMP/ios-app-store.mobileprovision"
          profile_plist="$RUNNER_TEMP/ios-app-store.plist"
          live_activity_profile_path="$RUNNER_TEMP/ios-live-activity-app-store.mobileprovision"
          live_activity_profile_plist="$RUNNER_TEMP/ios-live-activity-app-store.plist"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          printf '%s' "$IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$live_activity_profile_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "IOS_PROVISIONING_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

          security cms -D -i "$live_activity_profile_path" > "$live_activity_profile_plist"
          live_activity_profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$live_activity_profile_plist")
          live_activity_profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$live_activity_profile_plist")
          cp "$live_activity_profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$live_activity_profile_uuid.mobileprovision"
          echo "IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_NAME=$live_activity_profile_name" >> "$GITHUB_ENV"

      - name: Set iOS build number
        if: steps.ios-secrets.outputs.ready == 'true'
        run: echo "IOS_BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      - name: Upload iOS build to TestFlight
        if: steps.ios-secrets.outputs.ready == 'true'
        run: tools/fastlane.sh ios beta
