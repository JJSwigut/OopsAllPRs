name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android and shared checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Gradle checks
        run: ./gradlew --no-daemon check :androidApp:assembleDebug :androidApp:assembleRelease

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shared debug simulator framework
        run: ./gradlew --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Build iOS debug simulator app
        run: |
          xcodebuild \
            -project iosApp/OopsAllPRs.xcodeproj \
            -scheme OopsAllPRs \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
